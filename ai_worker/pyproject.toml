[project]
name = "ai_worker"
version = "0.1.0"
description = "Worker for AI tasks, including image processing and model inference."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.128.8",
    # Pin python-multipart explicitly: fastapi[standard] pulls it transitively,
    # but PyApp's install resolves the wheel's deps fresh from PyPI rather than
    # honoring uv.lock — so without an explicit pin, PyApp can land a different
    # version than Docker's locked one, and `request.form()` starts returning
    # "There was an error parsing the body" on /convert. Match the lock.
    "python-multipart==0.0.22",
    "instructor>=1.14.5",
    "openai>=2.29.0",
    "python-dotenv>=1.2.1",
    "pillow>=10.0",
    "rawpy>=0.18",
    "numpy>=1.24",
    "torch>=2.2",
    "torchvision>=0.17",
    "open_clip_torch>=2.24",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

# Console script for freezers (Nuitka entry point) and PyApp (PYAPP_EXEC_SPEC).
# `fineshyt_ai.serve:main` calls uvicorn.run on the FastAPI app — see that
# module for the rationale (`fastapi run` is a CLI wrapper, not freezable).
[project.scripts]
fineshyt-ai-worker = "fineshyt_ai.serve:main"

# Project name (`ai_worker`) doesn't match the source-layout package
# (`src/fineshyt_ai/`), so hatchling needs the path spelled out. Required so
# `uv build` produces a wheel PyApp can consume, and so `uv sync` installs the
# console script entry point above.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fineshyt_ai"]

# Sdist would otherwise sweep in build_nuitka/ (6+GB of intermediate Nuitka
# objects) and .venv/. Include only the actual source.
[tool.hatch.build.targets.sdist]
include = ["src/fineshyt_ai/", "pyproject.toml", "README.md", "uv.lock"]

# CLIP runs on CPU/Metal here (no NVIDIA GPU), but the default torch wheel is
# the CUDA build (+cuXXX) which drags in ~2.8GB of unused nvidia libs + triton.
# Pin torch/torchvision to the CPU-only index: site-packages 4.6GB → ~1.2GB,
# which both shrinks the Docker image and is the prerequisite for the C4 freeze
# (CUDA's dynamic loading is exactly what trips up PyInstaller/Nuitka).
#
# FUTURE (way later): expose a GPU opt-in for users who have an NVIDIA card —
# a `cuda` optional-dependencies extra + conflicting source so `uv sync --extra
# cuda` pulls CUDA torch, while the default (desktop bundle, Alan, Mac) stays
# CPU. Note the LLM already GPU-accelerates via llama-server; this extra only
# speeds the CLIP embedding step, so it's low priority.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "nuitka>=4.1.2",
    "ordered-set>=4.1.0",
    "ruff>=0.15.8",
]
