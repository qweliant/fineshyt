# ⚠ WARNING: `docker compose down -v` DESTROYS the sqlitedb volume and all
# database contents (photos, embeddings, scores). Use `docker compose down`
# (without -v) to stop services safely. Back up first: ./scripts/backup.sh
#
# Since C3 the orchestrator uses a native SQLite database (no Postgres
# container). See .env.example for the variables this file expects.

services:
  orchestrator:
    # Profile-gated: only starts on `docker compose --profile compose up`
    # (i.e. via `make compose`). Bare `docker compose up -d` starts nothing
    # (both services are profile-gated), so native dev doesn't collide with
    # a containerised orchestrator on port 4000.
    profiles: ["compose"]
    build: ./orchestrator
    depends_on:
      ai_worker:
        condition: service_started
    environment:
      # SQLite db lives on the sqlitedb named volume so it survives container
      # re-creation. The app creates the file + parent dir on boot.
      DATABASE_PATH: /app/data/fineshyt.db
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env — run `make compose-init` to generate one}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: http
      PHX_URL_PORT: "4000"
      PORT: "4000"
      AI_WORKER_URL: http://ai_worker:8000
      # Read by the LiveView's `default_chips/0` to surface each drive as
      # a clickable chip in the gallery's Directory field. Empty in
      # single-drive mode (the `/photos` chip covers it instead).
      PHOTO_LIBRARIES: ${PHOTO_LIBRARIES:-}
    # Boot sequence:
    #   1. setup-uploads-symlink — reconciles the release-priv path Phoenix
    #      reads from with the /app/priv/static/uploads bind-mount the user
    #      sees on disk, so old + new ingests land in one place.
    #   2. migrate — runs any pending Ecto migrations idempotently.
    #   3. server — starts Phoenix.
    # All three scripts come from rel/overlays/bin/ in the release layout.
    command:
      ["sh", "-c", "/app/bin/setup-uploads-symlink && /app/bin/migrate && /app/bin/server"]
    ports:
      - "4000:4000"
    volumes:
      # Persistent SQLite database (since C3). Survives container re-creation.
      - sqlitedb:/app/data
      # Shared with ai_worker so the orchestrator can write converted JPEGs
      # at a path the worker can read back. If UPLOADS_DIR is unset, this
      # resolves to the `uploads` named volume below; if set to a host path
      # (e.g. ./data/uploads or /Users/you/fineshyt-cache), it's a bind-mount
      # and you can browse the converted JPEGs directly from your file
      # manager.
      - ${UPLOADS_DIR:-uploads}:/app/priv/static/uploads
      # User's photo library. Read-only — fineshyt never mutates source files.
      # Path-mirrored (host source == container target) so the orchestrator
      # in C2 native mode and the still-containerised ai_worker both refer
      # to photos by the same absolute path. Without mirroring, the
      # orchestrator sends host paths the container can't resolve.
      - "${PHOTO_LIBRARY:?Set PHOTO_LIBRARY in .env}:${PHOTO_LIBRARY}:ro"
      - "/Users/qwelian/Pictures:/Users/qwelian/Pictures:ro"

  ai_worker:
    # Profile gating:
    #   - "compose" → full Docker stack (orchestrator + ai_worker both in containers).
    #   - "c2"      → C2 mode: orchestrator runs as a local Elixir release on
    #                 the host (with a native SQLite db since C3), but
    #                 ai_worker stays containerized (still has a 2GB+ Python
    #                 ML toolchain; freezing that into a sidecar is C4 work).
    #                 `--profile c2` brings up just the ai_worker — the only
    #                 service the native orchestrator still needs.
    profiles: ["compose", "c2"]
    build: ./ai_worker
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1/}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llava}
      STATIC_UPLOADS_DIR: /app/priv/static/uploads
    ports:
      - "8000:8000"
    volumes:
      # The ai_worker is filesystem-independent w.r.t. the user's photo
      # library: /convert and /curate receive source bytes as multipart
      # uploads (the orchestrator reads the originals off disk and streams
      # them), and /embed reads the converted JPEG back out of this shared
      # uploads volume. So no PHOTO_LIBRARY bind-mount is needed here — which
      # is what lets the worker run even when photos live on a drive Docker
      # Desktop can't bind-mount (e.g. an exFAT external SSD on macOS).
      - ${UPLOADS_DIR:-uploads}:/app/priv/static/uploads
      # CLIP model + HF cache. ~2GB on first run; persist so re-creating the
      # container doesn't re-download.
      - models:/cache
      # Pickled Ridge preference model.
      - preference:/root/.fineshyt
    extra_hosts:
      # Gives the container `host.docker.internal` on Linux too, so a single
      # LLM_BASE_URL works across macOS/Windows/Linux for an Ollama running
      # on the host.
      - "host.docker.internal:host-gateway"

volumes:
  sqlitedb:
  uploads:
  models:
  preference:
